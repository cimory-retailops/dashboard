<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛰️ RPS Territory Editor - Google Earth Mode</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- SheetJS for instant Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Supabase Client v2 for Realtime Multi-user Live Collaboration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #0b1120;
      --bg-panel: rgba(15, 23, 42, 0.92);
      --border-panel: rgba(255, 255, 255, 0.14);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
    }

    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
      background: #090d16;
    }

    /* Floating Header Top */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 60px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-panel);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }

    .top-bar h1 {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.06);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .status-badge strong {
      color: var(--accent);
    }

    /* Left Sidebar: Controls & Personil List */
    .sidebar {
      position: absolute;
      top: 66px;
      left: 12px;
      bottom: 12px;
      width: 410px;
      z-index: 1000;
      background: var(--bg-panel);
      backdrop-filter: blur(18px);
      border-radius: 14px;
      border: 1px solid var(--border-panel);
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 48px rgba(0,0,0,0.65);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.collapsed {
      transform: translateX(-430px);
    }

    .sidebar-toggle-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1001;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-panel);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .sidebar-toggle-btn:hover {
      background: var(--accent);
    }

    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-panel);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .search-box {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-panel);
      padding: 8px 12px;
      border-radius: 8px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
    }
    .search-box:focus {
      border-color: var(--accent);
    }

    /* Active Mode Selector */
    .active-mode-card {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 8px 12px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .active-mode-card .info {
      font-size: 11px;
    }

    .active-mode-card .info strong {
      display: block;
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
    }

    .btn-reset-mode {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reset-mode:hover {
      background: rgba(239,68,68,0.25);
      color: #fca5a5;
    }

    /* Action Buttons Row */
    .action-row {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border-panel);
      background: rgba(255,255,255,0.06);
      color: #fff;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: rgba(255,255,255,0.14);
    }
    .btn-action.btn-export {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .btn-action.btn-export:hover {
      background: #0369a1;
    }
    .btn-action.btn-undo {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fcd34d;
    }

    /* Bulk Visibility Buttons */
    .visibility-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid var(--border-panel);
      font-size: 11px;
    }

    .btn-text-tool {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 4px;
    }
    .btn-text-tool:hover {
      text-decoration: underline;
    }

    /* Personil List Scrollable */
    .personil-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .personil-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.15s ease;
    }

    .personil-item:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.18);
    }

    .personil-item.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
    }

    .personil-item.hidden-layer {
      opacity: 0.45;
      filter: grayscale(0.7);
    }

    .personil-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .toggle-visibility-btn {
      background: none;
      border: none;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      color: #94a3b8;
    }
    .toggle-visibility-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.1);
    }

    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #000;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
    }

    .personil-name {
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .personil-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .count-badge {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(0,0,0,0.5);
      color: #93c5fd;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .count-badge.target-ok {
      color: #86efac;
      border-color: rgba(34,197,94,0.3);
    }
    .count-badge.target-warn {
      color: #fca5a5;
      border-color: rgba(239,68,68,0.3);
    }
    .count-badge.target-under {
      background: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.85);
      animation: badge-blink 1.2s infinite ease-in-out;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    @keyframes pulse-under-target {
      0%, 100% {
        border-color: rgba(239, 68, 68, 0.45);
        background: rgba(239, 68, 68, 0.12);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.25);
      }
      50% {
        border-color: rgba(239, 68, 68, 0.95);
        background: rgba(239, 68, 68, 0.26);
        box-shadow: 0 0 14px 2px rgba(239, 68, 68, 0.5);
      }
    }

    @keyframes badge-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.96); }
    }

    .personil-item.under-target {
      animation: pulse-under-target 1.6s infinite ease-in-out;
      border: 1px solid rgba(239, 68, 68, 0.6) !important;
    }

    .btn-icon-sm {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-sub);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: 600;
    }
    .btn-icon-sm:hover {
      color: #fff;
      background: rgba(255,255,255,0.15);
    }

    /* Unassigned special card */
    .unassigned-card {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.35);
      margin-bottom: 2px;
    }
    .unassigned-card:hover {
      background: rgba(239, 68, 68, 0.18);
    }

    /* Custom Map Popup */
    .leaflet-popup-content-wrapper {
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-panel);
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.7);
    }
    .leaflet-popup-tip {
      background: var(--bg-panel);
    }
    .leaflet-popup-content {
      margin: 14px;
      min-width: 260px;
      max-width: 295px;
    }

    .store-popup h3 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }

    .store-popup .badge-account {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      margin-bottom: 8px;
    }

    .store-popup .meta-table {
      font-size: 11px;
      margin-bottom: 12px;
      color: var(--text-sub);
    }
    .store-popup .meta-table td {
      padding: 2px 4px;
    }
    .store-popup .meta-table td:first-child {
      font-weight: 600;
      color: #cbd5e1;
      width: 75px;
    }

    .popup-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mds-combobox {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
    }

    .reassign-search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--border-panel);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .reassign-search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
    }
    .reassign-search-input::placeholder {
      color: #64748b;
    }

    .mds-search-list {
      max-height: 125px;
      overflow-y: auto;
      background: rgba(11, 17, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 3px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mds-search-list::-webkit-scrollbar {
      width: 5px;
    }
    .mds-search-list::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    .mds-search-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
    }

    .mds-search-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      color: #cbd5e1;
      transition: background 0.12s, color 0.12s;
      user-select: none;
    }
    .mds-search-item:hover {
      background: rgba(56, 189, 248, 0.22);
      color: #fff;
    }
    .mds-search-item.is-current {
      background: rgba(56, 189, 248, 0.18);
      color: #38bdf8;
      font-weight: 600;
    }
    .mds-search-item .mds-item-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
    .mds-search-item .mds-item-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mds-search-item .mds-badge-curr {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      font-weight: 600;
    }

    .btn-popup-delete {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-popup-delete:hover {
      background: rgba(239,68,68,0.3);
    }

    /* Floating Bulk Action Bar */
    .bulk-action-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1500;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid #38bdf8;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: bulkSlideUp 0.2s ease-out;
    }

    @keyframes bulkSlideUp {
      from { transform: translateX(-50%) translateY(20px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    .bulk-count {
      font-size: 11.5px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .bulk-count strong {
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
    }

    .bulk-mds-select {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--border-panel);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      outline: none;
      min-width: 190px;
    }
    .bulk-mds-select:focus {
      border-color: #38bdf8;
    }

    .btn-bulk-apply {
      background: #0284c7;
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-bulk-apply:hover {
      background: #0369a1;
    }

    .btn-bulk-cancel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-bulk-cancel:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Active mode button highlight */
    .status-badge.mode-box-active,
    .btn-action.mode-box-active {
      background: #0284c7 !important;
      border-color: #38bdf8 !important;
      color: #fff !important;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Pin Size Slider */
    .pin-size-control {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 1000;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.5);
    }

    /* Notification toast */
    .toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      z-index: 2000;
      box-shadow: 0 12px 36px rgba(0,0,0,0.7);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Map Element -->
  <div id="map"></div>

  <!-- Sidebar Toggle Button -->
  <button id="btnToggleSidebar" class="sidebar-toggle-btn" title="Buka/Tutup Menu">☰</button>

  <!-- Top Status Bar -->
  <div class="top-bar">
    <a href="../index.html" class="status-badge" style="text-decoration:none; color:#cbd5e1; border-color:rgba(255,255,255,0.22); background:rgba(255,255,255,0.06); cursor:pointer;" title="Kembali ke Portal Hub Utama">
      🏠 <strong>Portal Hub</strong>
    </a>
    <a href="../02_dashboard_monitoring/index.html" class="status-badge" style="text-decoration:none; color:#93c5fd; border-color:rgba(56,189,248,0.35); background:rgba(56,189,248,0.12); cursor:pointer;" title="Buka Dashboard Monitoring">
      📊 <strong>Dashboard</strong>
    </a>
    <h1>🛰️ RPS Editor Jabodetabek & Banten</h1>
    <div class="status-badge">
      <span>Terisi:</span> <strong id="totalAssignedBadge">10,560</strong>
    </div>
    <div class="status-badge" style="border-color: rgba(239, 68, 68, 0.4);">
      <span style="color: #fca5a5;">Vacant:</span> <strong id="totalUnassignedBadge" style="color: #f87171;">2,603</strong>
    </div>
    <div class="status-badge" style="border-color: rgba(148, 163, 184, 0.4);">
      <span>Dibuang:</span> <strong id="totalRemovedBadge" style="color: #94a3b8;">0</strong>
    </div>
    <div class="status-badge" style="border-color: rgba(16, 185, 129, 0.4);">
      <span style="color: #86efac;">💾 Auto-Save:</span> <strong id="autoSaveBadge" style="color: #6ee7b7;">Aktif (0 editan)</strong>
    </div>
    <div class="status-badge" id="liveCollabBadge" style="border-color: rgba(56, 189, 248, 0.4); cursor: pointer;" title="Klik untuk ubah nama/inisial Anda">
      <span style="color: #38bdf8;">⚡ Live Sync:</span> <strong id="liveCollabText" style="color: #7dd3fc;">Menghubungkan...</strong>
    </div>
    <button id="btnTopBoxSelect" class="status-badge" style="border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.1); color: #38bdf8; cursor: pointer; font-weight: 700;" title="Klik untuk aktifkan seleksi kotak area di peta (atau tahan tombol Shift lalu drag di peta)">
      🔲 Seleksi Kotak (Area)
    </button>
  </div>

  <!-- Left Sidebar Panel -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <input type="text" id="inputSearch" class="search-box" placeholder="🔍 Cari toko, kode, atau kecamatan..." />

      <!-- Active Paint Mode Card -->
      <div id="paintModeCard" class="active-mode-card">
        <div class="info">
          <span style="color: var(--text-sub);">Mode Alokasi Aktif:</span>
          <strong id="activePersonilLabel">Klik Nama MDS Untuk Alokasi Cepat 👇</strong>
        </div>
        <button id="btnResetMode" class="btn-reset-mode">Netral</button>
      </div>

      <!-- Action Buttons Row -->
      <div class="action-row">
        <button id="btnUndo" class="btn-action btn-undo" title="Batalkan perubahan terakhir (Ctrl+Z)">↩️ Undo (<span id="undoCount">0</span>)</button>
        <button id="btnExportExcel" class="btn-action btn-export">💾 Download Excel</button>
        <button id="btnResetAll" class="btn-action" style="flex: 0.55; background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); color:#fca5a5;" title="Hapus cache & reset ke data awal">🔄 Reset</button>
      </div>
      <div class="action-row" style="margin-top: 6px;">
        <button id="btnToggleBoxSelect" class="btn-action" style="background: rgba(56, 189, 248, 0.16); border-color: rgba(56, 189, 248, 0.45); color: #7dd3fc; font-weight: 700;" title="Tarik kotak di peta untuk memilih banyak toko sekaligus">
          🔲 Seleksi Banyak (Area)
        </button>
        <button id="btnSyncSupabase" class="btn-action" style="background: rgba(16, 185, 129, 0.22); border-color: rgba(16, 185, 129, 0.5); color: #6ee7b7; font-weight: 700;" title="Upload & Sinkronkan master mapping ke Supabase Cloud">
          ☁️ Sync Cloud
        </button>
      </div>
    </div>

    <!-- Bulk Visibility Toolbar -->
    <div class="visibility-toolbar">
      <span style="color: var(--text-sub); font-weight: 600;">Area & Personil (22 MDS):</span>
      <div style="display: flex; gap: 8px;">
        <button id="btnShowAll" class="btn-text-tool">👁️ Tampilkan Semua</button>
        <button id="btnHideAll" class="btn-text-tool" style="color: #fca5a5;">🕶️ Sembunyikan Semua</button>
      </div>
    </div>

    <!-- Personil List (Scrollable) -->
    <div id="personilList" class="personil-list">
      <!-- Generated via JS -->
    </div>
  </div>

  <!-- Floating Bulk Action Bar (Muncul saat ada toko terpilih) -->
  <div id="bulkActionBar" class="bulk-action-bar" style="display: none;">
    <div class="bulk-count">
      <span>✨ Terpilih:</span> <strong id="bulkCountText">0 Toko</strong>
    </div>
    <select id="bulkTargetSelect" class="bulk-mds-select">
      <option value="">-- Pindahkan Ke Personil MDS --</option>
      <option value="__VACANT__">⚠️ Jadikan Toko VACANT</option>
    </select>
    <button id="btnApplyBulk" class="btn-bulk-apply">🚀 Terapkan</button>
    <button id="btnCancelBulk" class="btn-bulk-cancel" title="Batalkan seleksi">✕ Batal</button>
  </div>

  <!-- Pin Size Control Bottom Right -->
  <div class="pin-size-control">
    <span>Ukuran Pin:</span>
    <input type="range" id="sliderPinSize" min="3" max="10" value="6" step="1" style="width: 80px; cursor: pointer;" />
    <span id="labelPinSize" style="font-family:'JetBrains Mono';">6px</span>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Notifikasi</div>
</div>

<!-- Load Data -->
<script src="data/stores_data.js"></script>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(function() {
  // 22 CURATED HIGH-CONTRAST DISTINCT COLORS (TAILORED FOR MAXIMUM VISIBILITY ON SATELLITE)
  const HIGH_CONTRAST_COLORS = {
    'ABDUL KHOLIK': '#ff0000',            // Merah Terang
    'ANDI IRFANSYAH': '#ff8c00',          // Dark Orange
    'ANDRE ADITIA MULYANA': '#ffd700',    // Emas / Kuning Terang
    'ANDRIZKY SIMBOLON': '#00ff66',       // Neon Bright Green
    'ANGGA SETIAWAN': '#00e5ff',          // Cyan Neon
    'IRFANTO ABINOWO PAMBUKO': '#1e90ff', // Dodger Blue
    'MARJUKI': '#bf00ff',                 // Deep Purple
    'MIA ANJELINA': '#ff1493',            // Deep Pink
    'MUHAMMAD FEBRIMA NURSA': '#8b4513',  // Saddle Brown
    'MUHAMMAD FIKRI DARMAWAN': '#00fa9a', // Medium Spring Green
    'MUHAMMAD IRFAN NURSAID': '#dc143c',  // Crimson Red
    'NANA SUTISNA': '#4169e1',            // Royal Blue
    'NANANG JAZULI': '#7b68ee',           // Medium Slate Blue
    'RIANSYAH RASYIDILHAMID': '#00bfff',  // Deep Sky Blue
    'RINA ARIANA': '#ff00ff',             // Magenta / Fuchsia
    'RISWANDI': '#ffa500',                // Orange
    'RIZALDI': '#32cd32',                 // Lime Green
    'SARIPUDIN': '#00ffff',               // Aqua
    'SASKIA PUTRI': '#ff69b4',            // Hot Pink
    'TITI SRIYATI': '#ffd700',            // Golden
    'YANTO': '#adff2f',                   // Green Yellow
    'ZORO HARMOKO': '#da70d6'             // Orchid
  };

  // Global States
  let stores = window.STORE_DATA || [];
  let mdsList = window.MDS_LIST || [];
  let activePersonil = null;
  let undoStack = [];
  const MAX_UNDO = 300;
  let currentPinRadius = 6;

  // LayerGroups for ultra-fast individual show/hide
  // personilName -> L.layerGroup()
  const mdsLayerGroups = {};
  const unassignedLayerGroup = L.layerGroup();
  const visibilityState = {}; // personilName -> boolean, '__UNASSIGN__' -> boolean

  // Map stores to markers: storeId -> circleMarker
  const markerStoreMap = new Map();

  // Overwrite colors in mdsList with High-Contrast Colors
  mdsList.forEach(m => {
    if (HIGH_CONTRAST_COLORS[m.name]) {
      m.color = HIGH_CONTRAST_COLORS[m.name];
    }
    visibilityState[m.name] = true;
  });
  visibilityState['__UNASSIGN__'] = true;

  // DOM Elements
  const btnToggleSidebar = document.getElementById('btnToggleSidebar');
  const sidebar = document.getElementById('sidebar');
  const personilListContainer = document.getElementById('personilList');
  const inputSearch = document.getElementById('inputSearch');
  const activePersonilLabel = document.getElementById('activePersonilLabel');
  const btnResetMode = document.getElementById('btnResetMode');
  const btnUndo = document.getElementById('btnUndo');
  const undoCountLabel = document.getElementById('undoCount');
  const btnExportExcel = document.getElementById('btnExportExcel');
  const btnShowAll = document.getElementById('btnShowAll');
  const btnHideAll = document.getElementById('btnHideAll');
  const totalAssignedBadge = document.getElementById('totalAssignedBadge');
  const totalUnassignedBadge = document.getElementById('totalUnassignedBadge');
  const totalRemovedBadge = document.getElementById('totalRemovedBadge');
  const autoSaveBadge = document.getElementById('autoSaveBadge');
  const btnResetAll = document.getElementById('btnResetAll');
  const sliderPinSize = document.getElementById('sliderPinSize');
  const labelPinSize = document.getElementById('labelPinSize');

  // Tag initial original state
  stores.forEach(s => {
    s._origPersonil = s.personil;
    s._origStatus = s.status;
  });

  // LocalStorage Auto-Save System
  function saveLocalChanges() {
    try {
      const changeMap = {};
      let diffCount = 0;
      stores.forEach(s => {
        if (s.personil !== s._origPersonil || s.status !== s._origStatus) {
          changeMap[s.id] = { personil: s.personil, status: s.status };
          diffCount++;
        }
      });
      localStorage.setItem('RPS_EDITOR_SAVED_CHANGES', JSON.stringify(changeMap));
      if (autoSaveBadge) {
        autoSaveBadge.textContent = diffCount > 0 ? `Aktif (${diffCount} tersimpan)` : 'Aktif (0 editan)';
      }
    } catch(e) {
      console.error('Error saving local changes:', e);
    }
  }

  function loadLocalChanges() {
    try {
      const saved = localStorage.getItem('RPS_EDITOR_SAVED_CHANGES');
      if (!saved) return 0;
      const changeMap = JSON.parse(saved);
      let diffCount = 0;
      for (const [idStr, data] of Object.entries(changeMap)) {
        const id = parseInt(idStr);
        const s = stores.find(x => x.id === id);
        if (s) {
          s.personil = data.personil;
          s.status = data.status;
          diffCount++;
        }
      }
      return diffCount;
    } catch(e) {
      console.error('Error loading local changes:', e);
      return 0;
    }
  }

  if (btnResetAll) {
    btnResetAll.addEventListener('click', () => {
      if (confirm('Yakin ingin mereset SEMUA editan lokal dan kembali ke mapping awal?\nPerubahan yang belum diunduh ke Excel akan dihapus.')) {
        localStorage.removeItem('RPS_EDITOR_SAVED_CHANGES');
        location.reload();
      }
    });
  }

  // Prevent accidental close/refresh
  window.addEventListener('beforeunload', (e) => {
    try {
      const saved = localStorage.getItem('RPS_EDITOR_SAVED_CHANGES');
      if (saved && Object.keys(JSON.parse(saved)).length > 0) {
        e.preventDefault();
        e.returnValue = '';
      }
    } catch(err) {}
  });

  let map;

  btnToggleSidebar.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
  });

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  }

  // Init Map
  function initMap() {
    map = L.map('map', {
      center: [-6.25, 106.65],
      zoom: 11,
      minZoom: 8,
      maxZoom: 19,
      zoomControl: false,
      preferCanvas: true
    });

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Google Hybrid Satellite
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Satellite &copy; 2026'
    }).addTo(map);

    // Esri Satellite
    const esriWorld = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    });

    // Dark Carto
    const darkCarto = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; CartoDB'
    });

    L.control.layers({
      "🛰️ Google Hybrid (Default)": googleHybrid,
      "🌍 Esri Satellite": esriWorld,
      "🌑 Carto Dark": darkCarto
    }, null, { position: 'topright' }).addTo(map);

    // Initialize LayerGroups
    mdsList.forEach(m => {
      const lg = L.layerGroup();
      mdsLayerGroups[m.name] = lg;
      lg.addTo(map);
    });
    unassignedLayerGroup.addTo(map);

    // Setup Box / Area Selection on Map (Aktif lewat tombol atau Shift+Drag)
    map.on('mousedown', (e) => {
      if (!isBoxSelectMode && !e.originalEvent.shiftKey) return;
      isBoxSelecting = true;
      map.dragging.disable();
      boxStartLatLng = e.latlng;
      if (boxSelectRect) map.removeLayer(boxSelectRect);
      boxSelectRect = L.rectangle([boxStartLatLng, boxStartLatLng], {
        color: '#38bdf8',
        weight: 2,
        dashArray: '5, 5',
        fillColor: '#38bdf8',
        fillOpacity: 0.18
      }).addTo(map);
    });

    map.on('mousemove', (e) => {
      if (!isBoxSelecting || !boxStartLatLng || !boxSelectRect) return;
      boxSelectRect.setBounds(L.latLngBounds(boxStartLatLng, e.latlng));
    });

    map.on('mouseup', (e) => {
      if (!isBoxSelecting) return;
      isBoxSelecting = false;
      if (!isBoxSelectMode) map.dragging.enable();

      if (boxStartLatLng && boxSelectRect) {
        const bounds = boxSelectRect.getBounds();
        map.removeLayer(boxSelectRect);
        boxSelectRect = null;
        selectStoresInBounds(bounds, e.originalEvent.ctrlKey || e.originalEvent.shiftKey);
      }
    });
  }

  // --- MULTI-SELECT & AREA BOX SELECTION SYSTEM ---
  let isBoxSelecting = false;
  let isBoxSelectMode = false;
  let boxStartLatLng = null;
  let boxSelectRect = null;
  const selectedStoreIds = new Set();

  function setBoxSelectMode(active) {
    isBoxSelectMode = active;
    const btnTop = document.getElementById('btnTopBoxSelect');
    const btnSide = document.getElementById('btnToggleBoxSelect');

    if (isBoxSelectMode) {
      map.dragging.disable();
      map.getContainer().style.cursor = 'crosshair';
      if (btnTop) btnTop.classList.add('mode-box-active');
      if (btnSide) btnSide.classList.add('mode-box-active');
      showToast('🔲 Mode Seleksi Area AKTIF: Drag / tarik kotak di peta atau Shift+Klik pin toko');
    } else {
      map.dragging.enable();
      map.getContainer().style.cursor = '';
      if (btnTop) btnTop.classList.remove('mode-box-active');
      if (btnSide) btnSide.classList.remove('mode-box-active');
      showToast('Mode Seleksi Area Dinonaktifkan');
    }
  }

  function selectStoresInBounds(bounds, isAdditive = false) {
    if (!isAdditive) {
      selectedStoreIds.forEach(id => {
        const marker = markerStoreMap.get(id);
        const s = stores.find(x => x.id === id);
        if (marker && s) marker.setStyle(getMarkerStyle(s));
      });
      selectedStoreIds.clear();
    }

    let newlySelected = 0;
    stores.forEach(s => {
      if (s.status === 'removed') return;
      const isVis = s.personil ? visibilityState[s.personil] : visibilityState['__UNASSIGN__'];
      if (!isVis) return;

      if (bounds.contains([s.lat, s.lon])) {
        selectedStoreIds.add(s.id);
        const marker = markerStoreMap.get(s.id);
        if (marker) {
          marker.setStyle({
            color: '#facc15',
            weight: 3.5,
            radius: currentPinRadius + 3,
            fillOpacity: 1
          });
          marker.bringToFront();
        }
        newlySelected++;
      }
    });

    renderBulkActionBar();
    if (selectedStoreIds.size > 0) {
      showToast(`✨ ${selectedStoreIds.size} toko terpilih! Silakan tentukan MDS di bar bawah.`);
    }
  }

  window.toggleStoreSelection = function(storeId) {
    const s = stores.find(x => x.id === storeId);
    const marker = markerStoreMap.get(storeId);
    if (!s || !marker) return;

    if (selectedStoreIds.has(storeId)) {
      selectedStoreIds.delete(storeId);
      marker.setStyle(getMarkerStyle(s));
    } else {
      selectedStoreIds.add(storeId);
      marker.setStyle({
        color: '#facc15',
        weight: 3.5,
        radius: currentPinRadius + 3,
        fillOpacity: 1
      });
      marker.bringToFront();
    }
    renderBulkActionBar();
  };

  function clearSelection() {
    selectedStoreIds.forEach(id => {
      const marker = markerStoreMap.get(id);
      const s = stores.find(x => x.id === id);
      if (marker && s) marker.setStyle(getMarkerStyle(s));
    });
    selectedStoreIds.clear();
    renderBulkActionBar();
  }

  function renderBulkActionBar() {
    const bar = document.getElementById('bulkActionBar');
    const countText = document.getElementById('bulkCountText');
    const applyBtn = document.getElementById('btnApplyBulk');
    if (!bar) return;

    if (selectedStoreIds.size === 0) {
      bar.style.display = 'none';
      return;
    }

    bar.style.display = 'flex';
    if (countText) countText.innerText = `${selectedStoreIds.size} Toko`;
    if (applyBtn) applyBtn.innerText = `🚀 Pindahkan ${selectedStoreIds.size} Toko`;
  }

  async function applyBulkReassign() {
    const select = document.getElementById('bulkTargetSelect');
    if (!select || !select.value) {
      alert('Silakan pilih MDS tujuan terlebih dahulu dari dropdown!');
      return;
    }

    const targetVal = select.value;
    const newPersonil = targetVal === '__VACANT__' ? null : targetVal;
    const batchUndo = [];

    selectedStoreIds.forEach(id => {
      const s = stores.find(x => x.id === id);
      if (s) {
        batchUndo.push({
          id: s.id,
          oldPersonil: s.personil,
          newPersonil: newPersonil,
          oldStatus: s.status,
          newStatus: newPersonil ? 'assigned' : 'unassigned'
        });

        const oldPersonil = s.personil;
        const marker = markerStoreMap.get(s.id);
        if (marker) {
          if (oldPersonil && mdsLayerGroups[oldPersonil]) {
            mdsLayerGroups[oldPersonil].removeLayer(marker);
          } else {
            unassignedLayerGroup.removeLayer(marker);
          }
        }

        s.personil = newPersonil;
        s.status = newPersonil ? 'assigned' : 'unassigned';

        if (marker) {
          marker.setStyle(getMarkerStyle(s));
          marker.setTooltipContent(`${s.code} - ${s.name} [${s.personil || 'Vacant'}]`);
          if (newPersonil && mdsLayerGroups[newPersonil]) {
            mdsLayerGroups[newPersonil].addLayer(marker);
          } else {
            unassignedLayerGroup.addLayer(marker);
          }
        }

        upsertSingleStoreToSupabase(s);
        broadcastStoreChange(s, newPersonil, 'reassign');
      }
    });

    undoStack.push({ isBatch: true, items: batchUndo });
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    updateUndoCount();

    const count = batchUndo.length;
    clearSelection();
    select.value = '';
    updateCounters();
    renderPersonilList();
    saveLocalChanges();

    showToast(`🎉 Sukses! ${count} toko berhasil dipindahkan ke ${newPersonil || 'VACANT'}!`);
  }

  // Get Marker Styling (Bold, Saturated, Black Outline for Maximum Separation)
  function getMarkerStyle(s) {
    if (s.personil) {
      const col = HIGH_CONTRAST_COLORS[s.personil] || '#38bdf8';
      return {
        radius: s.is_dc ? currentPinRadius + 3 : currentPinRadius,
        fillColor: col,
        color: '#000000',     // Black crisp outline
        weight: s.is_dc ? 3 : 1.4,
        opacity: 1,
        fillOpacity: 1
      };
    } else {
      // Unassigned (Glowing White with Red Outline)
      return {
        radius: Math.max(3.5, currentPinRadius - 1),
        fillColor: '#ffffff',
        color: '#ff0033',
        weight: 2.2,
        opacity: 1,
        fillOpacity: 0.95
      };
    }
  }

  // Build Marker for a store
  function createMarker(s) {
    const opt = getMarkerStyle(s);
    const marker = L.circleMarker([s.lat, s.lon], opt);

    const tooltipText = `${s.code} - ${s.name} [${s.personil || 'Vacant'}]`;
    marker.bindTooltip(tooltipText, { direction: 'top', offset: [0, -5] });

    marker.on('click', (e) => onMarkerClick(s, marker, e));
    markerStoreMap.set(s.id, marker);

    // Add to appropriate layerGroup
    if (s.personil && mdsLayerGroups[s.personil]) {
      mdsLayerGroups[s.personil].addLayer(marker);
    } else if (!s.personil) {
      unassignedLayerGroup.addLayer(marker);
    }

    return marker;
  }

  // Initialize all markers
  function buildAllMarkers() {
    stores.forEach(s => {
      if (s.status === 'removed') return;
      createMarker(s);
    });
    updateCounters();
  }

  // Marker Click Action
  function onMarkerClick(s, marker, e) {
    // Jika Mode Seleksi Aktif atau User Klik sambil menahan Shift/Ctrl -> Toggle Seleksi Multi
    if (isBoxSelectMode || (e && e.originalEvent && (e.originalEvent.shiftKey || e.originalEvent.ctrlKey))) {
      window.toggleStoreSelection(s.id);
      return;
    }

    // If Active Paint Mode is on, immediately assign!
    if (activePersonil) {
      if (activePersonil === '__UNASSIGN__') {
        reassignStore(s, null);
        showToast(`Toko ${s.name} dijadikan VACANT`);
      } else {
        reassignStore(s, activePersonil);
        showToast(`Toko ${s.name} dialokasikan ke ${activePersonil}`);
      }
      return;
    }

    // Otherwise show popup inspector
    const popupContent = `
      <div class="store-popup">
        <span class="badge-account" style="background: ${s.account === 'ALFAMART' ? 'rgba(239,68,68,0.25); color:#fca5a5;' : (s.account === 'INDOMARET' ? 'rgba(56,189,248,0.25); color:#93c5fd;' : 'rgba(245,158,11,0.25); color:#fde68a;')}">
          ${s.account} ${s.is_dc ? '⭐ [TITIK DC]' : ''}
        </span>
        <h3>${s.name}</h3>
        <table class="meta-table">
          <tr><td>Kode Toko:</td><td><strong>${s.code}</strong></td></tr>
          <tr><td>Kecamatan:</td><td>${s.kec || '-'}</td></tr>
          <tr><td>Kab/Kota:</td><td>${s.kab || '-'}</td></tr>
          <tr><td>Status:</td><td><strong style="color:${s.personil ? '#86efac' : '#f87171'}">${s.personil ? s.personil : '⚠️ VACANT'}</strong></td></tr>
          <tr><td>Rute Hari:</td><td>Hari ke-${s.rute || 1}</td></tr>
        </table>
        
        <div class="popup-actions">
          <!-- Checkbox Vacant di luar dropdown -->
          <label style="display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600; color:#fca5a5; background:rgba(239,68,68,0.14); padding:6px 10px; border-radius:6px; border:1px solid rgba(239,68,68,0.35); cursor:pointer; margin-bottom:2px;">
            <input type="checkbox" id="chkVacant_${s.id}" ${!s.personil ? 'checked' : ''} onchange="window.handleToggleVacant(${s.id}, this.checked)" style="width:15px; height:15px; cursor:pointer;" />
            <span>Tandai Sebagai Toko Vacant</span>
          </label>

          <label style="font-size:10px; color:#94a3b8; margin-top:2px;">Pindahkan ke Personil MDS:</label>
          <div class="mds-combobox">
            <input type="text" 
                   id="mdsSearch_${s.id}" 
                   class="reassign-search-input" 
                   placeholder="🔍 Ketik cari nama MDS..." 
                   oninput="window.filterMdsList(${s.id}, this.value)"
                   onkeydown="if(event.key==='Enter') window.selectFirstFilteredMds(${s.id})"
                   autocomplete="off" />
            <div class="mds-search-list" id="mdsList_${s.id}">
              ${mdsList.map(m => `
                <div class="mds-search-item ${s.personil === m.name ? 'is-current' : ''}" 
                     data-name="${m.name.toLowerCase()}" 
                     onclick="window.handleSelectReassign(${s.id}, '${m.name}')">
                  <span class="mds-item-dot" style="background:${m.color};"></span>
                  <span class="mds-item-name">${m.name}</span>
                  ${s.personil === m.name ? '<span class="mds-badge-curr">Saat ini</span>' : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <button type="button" class="btn-popup-select" style="background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: #7dd3fc; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;" onclick="window.toggleStoreSelection(${s.id}); map.closePopup();">
            ${selectedStoreIds.has(s.id) ? '✕ Hapus dari Seleksi Multi-Toko' : '➕ Tambah ke Pilihan Seleksi (Multi)'}
          </button>

          <button class="btn-popup-delete" onclick="window.handleDeleteStore(${s.id})">
            🗑️ Hapus dari List / Buang Toko Ini
          </button>
        </div>
      </div>
    `;

    L.popup({ offset: [0, -6] })
      .setLatLng([s.lat, s.lon])
      .setContent(popupContent)
      .openOn(map);
  }

  // Reassign Store and update LayerGroup
  function reassignStore(s, newPersonil, isRemote = false) {
    const oldPersonil = s.personil;
    const oldStatus = s.status;

    if (oldPersonil === newPersonil && oldStatus !== 'removed') return;

    if (!isRemote) {
      // Push to undo stack
      undoStack.push({
        id: s.id,
        oldPersonil: oldPersonil,
        newPersonil: newPersonil,
        oldStatus: oldStatus,
        newStatus: newPersonil ? 'assigned' : 'unassigned'
      });
      if (undoStack.length > MAX_UNDO) undoStack.shift();
      updateUndoCount();
    }

    // Remove from old layerGroup
    const marker = markerStoreMap.get(s.id);
    if (marker) {
      if (oldPersonil && mdsLayerGroups[oldPersonil]) {
        mdsLayerGroups[oldPersonil].removeLayer(marker);
      } else {
        unassignedLayerGroup.removeLayer(marker);
      }
    }

    // Apply new data
    s.personil = newPersonil;
    s.status = newPersonil ? 'assigned' : 'unassigned';

    // Update marker and add to new layerGroup
    if (marker) {
      marker.setStyle(getMarkerStyle(s));
      marker.setTooltipContent(`${s.code} - ${s.name} [${s.personil || 'Vacant'}]`);

      if (newPersonil && mdsLayerGroups[newPersonil]) {
        mdsLayerGroups[newPersonil].addLayer(marker);
      } else if (!newPersonil) {
        unassignedLayerGroup.addLayer(marker);
      }
    }

    updateCounters();
    renderPersonilList();
    saveLocalChanges();

    if (!isRemote) {
      broadcastStoreChange(s, newPersonil, 'reassign');
      upsertSingleStoreToSupabase(s);
    }
  }

  // Undo Function
  function doUndo() {
    if (undoStack.length === 0) {
      showToast('Tidak ada perubahan untuk di-undo');
      return;
    }

    const action = undoStack.pop();
    updateUndoCount();

    const items = action.isBatch ? action.items : [action];

    items.forEach(act => {
      const s = stores.find(x => x.id === act.id);
      if (!s) return;

      const currentP = s.personil;
      let marker = markerStoreMap.get(s.id);
      if (marker) {
        if (currentP && mdsLayerGroups[currentP]) {
          mdsLayerGroups[currentP].removeLayer(marker);
        } else {
          unassignedLayerGroup.removeLayer(marker);
        }
      }

      s.personil = act.oldPersonil;
      s.status = act.oldStatus;

      if (s.status !== 'removed') {
        if (!marker) {
          marker = createMarker(s);
        } else {
          marker.setStyle(getMarkerStyle(s));
          marker.setTooltipContent(`${s.code} - ${s.name} [${s.personil || 'Vacant'}]`);
          if (s.personil && mdsLayerGroups[s.personil]) {
            mdsLayerGroups[s.personil].addLayer(marker);
          } else {
            unassignedLayerGroup.addLayer(marker);
          }
        }
      }

      upsertSingleStoreToSupabase(s);
      broadcastStoreChange(s, s.personil, 'reassign');
    });

    showToast(`↩️ Undo berhasil untuk ${items.length} perubahan toko`);
    updateCounters();
    renderPersonilList();
    saveLocalChanges();
  }

  btnUndo.addEventListener('click', doUndo);
  window.addEventListener('keydown', (e) => {

  // Render Personil List in Sidebar
  function renderPersonilList() {
    const counts = {};
    mdsList.forEach(m => counts[m.name] = 0);
    let unassignedCount = 0;

    stores.forEach(s => {
      if (s.status === 'removed') return;
      if (s.personil && counts[s.personil] !== undefined) {
        counts[s.personil]++;
      } else if (!s.personil) {
        unassignedCount++;
      }
    });

    personilListContainer.innerHTML = '';

    // 1. Unassigned Card
    const unVisible = visibilityState['__UNASSIGN__'];
    const unCard = document.createElement('div');
    unCard.className = `personil-item unassigned-card ${activePersonil === '__UNASSIGN__' ? 'active' : ''} ${!unVisible ? 'hidden-layer' : ''}`;
    unCard.innerHTML = `
      <div class="personil-info">
        <button class="toggle-visibility-btn" title="${unVisible ? 'Sembunyikan' : 'Tampilkan'}">${unVisible ? '👁️' : '🕶️'}</button>
        <div class="color-dot" style="background: #ffffff; border-color: #ff0033;"></div>
        <span class="personil-name" style="color: #fca5a5;">⚠️ Toko Vacant</span>
      </div>
      <div class="personil-actions">
        <span class="count-badge" style="background: rgba(239,68,68,0.25); color: #fca5a5;">${unassignedCount}</span>
        <button class="btn-icon-sm btn-isolate" title="Isolasi / Hanya Tampilkan Ini">Hanya</button>
      </div>
    `;

    unCard.querySelector('.toggle-visibility-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      togglePersonilVisibility('__UNASSIGN__');
    });

    unCard.querySelector('.btn-isolate').addEventListener('click', (e) => {
      e.stopPropagation();
      isolatePersonil('__UNASSIGN__');
    });

    unCard.querySelector('.personil-info').addEventListener('click', () => {
      setActivePersonil('__UNASSIGN__');
    });

    personilListContainer.appendChild(unCard);

    // 2. 22 MDS Cards: Prioritaskan yang under-target (< 480) ke jajaran paling atas!
    const sortedMds = [...mdsList].sort((a, b) => {
      const cntA = counts[a.name] || 0;
      const cntB = counts[b.name] || 0;
      const isUnderA = cntA < 480;
      const isUnderB = cntB < 480;

      if (isUnderA && !isUnderB) return -1;
      if (!isUnderA && isUnderB) return 1;
      if (isUnderA && isUnderB) {
        // Yang paling kurang (terendah) ditaruh paling atas
        if (cntA !== cntB) return cntA - cntB;
      }
      return a.name.localeCompare(b.name);
    });

    sortedMds.forEach(m => {
      const cnt = counts[m.name] || 0;
      const isVis = visibilityState[m.name];
      const isUnder = cnt < 480;
      const shortfall = 480 - cnt;

      let targetClass = '';
      if (cnt === 480) targetClass = 'target-ok';
      else if (cnt > 480) targetClass = 'target-warn';
      else targetClass = 'target-under';

      const item = document.createElement('div');
      item.className = `personil-item ${isUnder ? 'under-target' : ''} ${activePersonil === m.name ? 'active' : ''} ${!isVis ? 'hidden-layer' : ''}`;

      item.innerHTML = `
        <div class="personil-info">
          <button class="toggle-visibility-btn" title="${isVis ? 'Sembunyikan' : 'Tampilkan'}">${isVis ? '👁️' : '🕶️'}</button>
          <div class="color-dot" style="background: ${m.color};"></div>
          <span class="personil-name">${m.name}</span>
          ${isUnder ? `<span style="font-size:9.5px; font-weight:700; color:#fca5a5; margin-left:4px;">(Kurang ${shortfall})</span>` : ''}
        </div>
        <div class="personil-actions">
          <span class="count-badge ${targetClass}" title="${isUnder ? `Kurang ${shortfall} toko dari target 480` : `Target 480 terpenuhi`}">${isUnder ? `⚠️ ${cnt}` : cnt}</span>
          <button class="btn-icon-sm btn-isolate" title="Isolasi (Hanya tampilkan personil ini)">Hanya</button>
          <button class="btn-icon-sm btn-focus" title="Fokus / Zoom ke Area MDS Ini">🎯</button>
        </div>
      `;

      // Eye visibility toggle
      item.querySelector('.toggle-visibility-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        togglePersonilVisibility(m.name);
      });

      // Isolate button
      item.querySelector('.btn-isolate').addEventListener('click', (e) => {
        e.stopPropagation();
        isolatePersonil(m.name);
        focusOnPersonil(m.name);
      });

      // Focus button
      item.querySelector('.btn-focus').addEventListener('click', (e) => {
        e.stopPropagation();
        focusOnPersonil(m.name);
      });

      // Click name to activate paint mode
      item.querySelector('.personil-info').addEventListener('click', () => {
        setActivePersonil(m.name);
      });

      personilListContainer.appendChild(item);
    });
  }

  // Focus Map to Personil Cluster
  function focusOnPersonil(name) {
    const personilStores = stores.filter(s => s.personil === name && s.status !== 'removed');
    if (personilStores.length === 0) {
      showToast(`Belum ada toko untuk ${name}`);
      return;
    }

    const lats = personilStores.map(s => s.lat);
    const lons = personilStores.map(s => s.lon);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);

    map.fitBounds([
      [minLat, minLon],
      [maxLat, maxLon]
    ], { padding: [60, 60] });

    // Make sure layer is visible
    if (!visibilityState[name]) {
      togglePersonilVisibility(name);
    }

    showToast(`Fokus ke klaster ${name} (${personilStores.length} toko)`);
  }

        config: {
          broadcast: { ack: false },
          presence: { key: currentUsername }

      liveChannel.on('presence', { event: 'sync' }, () => {

          badgeText.innerText = `🟢 ${count} Online (${currentUsername})`;

      });

      // 2. Broadcast Listener: Penugasan Toko

        const s = stores.find(x => x.code === payload.code || x.id === payload.id);
        if (s) {
          reassignStore(s, payload.newPersonil, true);
          showToast(`⚡ [${payload.sender}] ubah ${s.name} ➔ ${payload.newPersonil || 'VACANT'}`);
        }
      });

      // 3. Broadcast Listener: Penghapusan Toko
      liveChannel.on('broadcast', { event: 'store_deleted' }, ({ payload }) => {
        if (!payload || payload.sender === currentUsername) return;
        const s = stores.find(x => x.code === payload.code || x.id === payload.id);
        if (s && s.status !== 'removed') {
          const marker = markerStoreMap.get(s.id);
          if (marker) {

      });

      liveChannel.subscribe(async (status) => {

      if (badgeText) badgeText.innerText = 'Offline';
    }
  }

    if (!supabaseClient) return;
    try {
      await supabaseClient.from('tbl_store_assignments').upsert({
        kode_toko: s.code,
        nama_toko: s.name,
        account: s.account || 'ALFAMART',
        modul: s.modul || 'DK1',
        assigned_personil: s.status === 'removed' ? null : (s.personil || null),
        status: s.status || (s.personil ? 'assigned' : 'vacant'),
        rute: parseInt(s.rute, 10) || 1,
        latitude: s.lat,
        longitude: s.lon,
        kecamatan: s.kec || '',
        kab_kota: s.kab || '',
        updated_by: currentUsername,
        updated_at: new Date().toISOString()
      }, { onConflict: 'kode_toko' });
    } catch (e) {
      console.warn('Upsert single store error:', e);
    }
  }

  // Setup Button Sync All to Supabase Cloud
  const btnSyncSupabase = document.getElementById('btnSyncSupabase');
  if (btnSyncSupabase) {
    btnSyncSupabase.onclick = async () => {
      if (!supabaseClient) {
        showToast('⚠️ Koneksi Supabase belum siap');
        return;
      }
      if (!confirm(`Upload dan sinkronkan seluruh data mapping (${stores.length.toLocaleString('id-ID')} toko) ke tabel tbl_store_assignments di Supabase?`)) {
        return;
      }

      const originalText = btnSyncSupabase.innerHTML;
      btnSyncSupabase.disabled = true;
      btnSyncSupabase.style.opacity = '0.6';

      const BATCH_SIZE = 500;
      const total = stores.length;
      let syncedCount = 0;

      try {
        showToast(`☁️ Memulai upload ${total.toLocaleString('id-ID')} toko ke Supabase...`);

        for (let i = 0; i < total; i += BATCH_SIZE) {
          const chunk = stores.slice(i, i + BATCH_SIZE).map(s => ({
            kode_toko: s.code,
            nama_toko: s.name,
            account: s.account || 'ALFAMART',
            modul: s.modul || 'DK1',
            assigned_personil: s.status === 'removed' ? null : (s.personil || null),
            status: s.status || (s.personil ? 'assigned' : 'vacant'),
            rute: parseInt(s.rute, 10) || 1,
            latitude: s.lat,
            longitude: s.lon,
            kecamatan: s.kec || '',
            kab_kota: s.kab || '',
            updated_by: currentUsername,
            updated_at: new Date().toISOString()
          }));

          const { error } = await supabaseClient
            .from('tbl_store_assignments')
            .upsert(chunk, { onConflict: 'kode_toko' });

          if (error) throw error;

          syncedCount += chunk.length;
          btnSyncSupabase.innerHTML = `☁️ ${Math.round((syncedCount / total) * 100)}% (${syncedCount.toLocaleString('id-ID')}/${total.toLocaleString('id-ID')})`;
        }

        showToast(`✅ SUKSES! Seluruh ${total.toLocaleString('id-ID')} toko tersimpan di Supabase Cloud.`);
      } catch (err) {
        console.error('Bulk sync failed:', err);
        showToast(`❌ Gagal upload: ${err.message || 'Error koneksi'}`);
      } finally {
        btnSyncSupabase.disabled = false;
        btnSyncSupabase.style.opacity = '1';
        btnSyncSupabase.innerHTML = originalText;
      }
    };
  }

  // Load existing revisions from Supabase Cloud on boot
  async function loadCloudAssignments() {
    if (!supabaseClient) return;
    try {
      let allCloudData = [];
      let from = 0;
      const step = 1000;
      let hasMore = true;

      while (hasMore) {
        const { data, error } = await supabaseClient
          .from('tbl_store_assignments')
          .select('kode_toko, assigned_personil, status')
          .range(from, from + step - 1);

        if (error || !data || data.length === 0) {
          hasMore = false;
          break;
        }
        allCloudData = allCloudData.concat(data);
        if (data.length < step) {
          hasMore = false;
        } else {
          from += step;
        }
      }

      if (allCloudData.length > 0) {
        let diffs = 0;
        const mapCloud = new Map();
        allCloudData.forEach(r => mapCloud.set(r.kode_toko, r));

        stores.forEach(s => {
          if (mapCloud.has(s.code)) {
            const row = mapCloud.get(s.code);
            const cloudP = row.assigned_personil;
            const cloudStatus = row.status;
            if (s.personil !== cloudP || s.status !== cloudStatus) {
              s.personil = cloudP;
              s.status = cloudStatus;
              diffs++;
            }
          }
        });

        if (diffs > 0) {
          // Re-sort markers into proper layerGroups
          Object.values(mdsLayerGroups).forEach(lg => lg.clearLayers());
          unassignedLayerGroup.clearLayers();
          stores.forEach(s => {
            if (s.status === 'removed') return;
            const marker = markerStoreMap.get(s.id);
            if (marker) {
              marker.setStyle(getMarkerStyle(s));
              marker.setTooltipContent(`${s.code} - ${s.name} [${s.personil || 'Vacant'}]`);
              if (s.personil && mdsLayerGroups[s.personil]) {
                mdsLayerGroups[s.personil].addLayer(marker);
              } else if (!s.personil) {
                unassignedLayerGroup.addLayer(marker);
              }
            }
          });

          updateCounters();
          renderPersonilList();
          showToast(`☁️ Cloud Sync: ${diffs} toko disinkronkan dengan data cloud terbaru.`);
        }
      }
    } catch(err) {
      console.warn('Load cloud assignments error:', err);
    }
  }

  // Boot
  initMap();
  const loadedEdits = loadLocalChanges();
  buildAllMarkers();
  renderPersonilList();
  initRealtimeCollab();
  loadCloudAssignments();

  // Populate Bulk Target Select Dropdown
  const bulkSelect = document.getElementById('bulkTargetSelect');
  if (bulkSelect) {
    mdsList.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.name;
      opt.textContent = `👤 ${m.name}`;
      bulkSelect.appendChild(opt);
    });
  }

  const btnTopBox = document.getElementById('btnTopBoxSelect');
  const btnSideBox = document.getElementById('btnToggleBoxSelect');
  if (btnTopBox) btnTopBox.onclick = () => setBoxSelectMode(!isBoxSelectMode);
  if (btnSideBox) btnSideBox.onclick = () => setBoxSelectMode(!isBoxSelectMode);

  const btnApply = document.getElementById('btnApplyBulk');
  const btnCancel = document.getElementById('btnCancelBulk');
  if (btnApply) btnApply.onclick = applyBulkReassign;
  if (btnCancel) btnCancel.onclick = clearSelection;

  if (autoSaveBadge) {
    autoSaveBadge.textContent = loadedEdits > 0 ? `Aktif (${loadedEdits} tersimpan)` : 'Aktif (0 editan)';
  }
  if (loadedEdits > 0) {
    setTimeout(() => {
      showToast(`💾 Auto-Save: Berhasil memuat ${loadedEdits} editan dari sesi sebelumnya!`);
    }, 600);
  }

})();
</script>

</body>
