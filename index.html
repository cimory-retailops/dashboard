<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengalihkan ke Server VPS...</title>
    <script>
        (function() {
            var vpsBase = "http://103.55.38.180";
            var path = window.location.pathname || "";
            var search = window.location.search || "";
            var hash = window.location.hash || "";

            // Deteksi modul spesifik (01 s/d 07) dari URL lama
            var moduleMatch = path.match(/(0[1-7]_[a-zA-Z0-9_\-\/]+(\.html)?)/i);
            
            var targetUrl = vpsBase + "/";
            if (moduleMatch && moduleMatch[1]) {
                var subPath = moduleMatch[1];
                // Jika cuma folder (misal 02_dashboard_monitoring), pastikan format rapi
                if (!subPath.endsWith(".html") && !subPath.endsWith("/")) {
                    subPath += "/";
                }
                targetUrl = vpsBase + "/" + subPath + search + hash;
            } else {
                targetUrl = vpsBase + "/" + search + hash;
            }

            // Simpan link target untuk tombol manual jika auto-redirect terhalang
            window.__targetUrl = targetUrl;
            window.location.replace(targetUrl);
        })();
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            padding: 1rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 2.2rem;
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 460px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(12px);
        }
        .spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto 1.5rem auto;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 0.5rem 0; font-size: 1.35rem; color: #ffffff; }
        p { margin: 0 0 1.2rem 0; font-size: 0.95rem; color: #94a3b8; line-height: 1.5; }
        .target-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            word-break: break-all;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>🚀 Mengalihkan ke Server VPS</h2>
        <p>Sistem Retail Ops telah dipindahkan penuh ke server VPS production.</p>
        <div class="target-box" id="targetDisplay">Memuat URL tujuan...</div>
        <a id="targetLink" href="http://103.55.38.180/" class="btn">Klik Di Sini Jika Tidak Dialihkan Otomatis</a>
    </div>

    <script>
        // Update display dan link manual
        (function() {
            var url = window.__targetUrl || "http://103.55.38.180/";
            var elDisplay = document.getElementById("targetDisplay");
            var elLink = document.getElementById("targetLink");
            if (elDisplay) elDisplay.innerText = url;
            if (elLink) elLink.href = url;
        })();
    </script>
</body>
</html>
